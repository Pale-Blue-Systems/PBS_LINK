name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup.py declares python_requires >= 3.8. actions/python-versions
          # publishes Linux x64 builds of 3.8.18 and 3.9.25 for Ubuntu 22.04
          # and 24.04, and none for Ubuntu 26.04. ubuntu-latest moves to the
          # newest GA runner image (actions/runner-images README, "Label
          # scheme"), so 3.8 and 3.9 are pinned to ubuntu-24.04.
          - os: ubuntu-24.04
            python-version: "3.8"
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pytest
        run: python -m pip install . pytest
      - name: Run unit tests
        run: pytest -q TESTS
      - name: Run example
        run: python EXAMPLES/rover_alert.py
      - name: Run documentation examples
        run: python TESTS/doc_examples.py README.md DOCS/INTEGRATION.md DOCS/SPECIFICATIONS.md
